[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "lakebase-assess"
version = "1.0.0"
description = "Frictionless locally-executable SQL-to-Databricks Lakebase migration assessment engine"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "click>=8.1.0",
    "pydantic>=2.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "rich>=13.0",
    "jinja2>=3.1",
    "plotly>=5.15",
    "streamlit>=1.25",
    "cryptography>=41.0",
    "sqlalchemy>=2.0",
    "snowflake-connector-python>=3.8",
    "boto3>=1.28",
    "google-cloud-bigquery>=3.11",
    "pyyaml>=6.0",
    "reportlab>=4.0",
    "openpyxl>=3.1",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-mock>=3.11",
    "mypy>=1.5",
    "ruff>=0.1",
]

[project.scripts]
lakebase-assess = "src.cli:cli"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py310"
