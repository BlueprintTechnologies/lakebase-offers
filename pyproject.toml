[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lakebase-assess"
version = "0.1.0"
description = "Lakebase Assessment Tool"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Blueprint Technologies", email = "dev@blueprint.com"}]
keywords = ["assessment", "migration", "RDBMS", "SQL", "Databricks"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Topic :: Database",
]
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "pyarrow>=12.0",
    "markdown-it-py>=3.0",
    "jinja2>=3.1",
    "reportlab>=4.0",
    "plotly>=5.0",
    "jsonschema>=4.0",
    "boto3>=1.34",
    "psycopg2-binary>=2.9",
    "pymssql>=2.2",
    "python-docx>=1.1"
]

[project.urls]
"Homepage" = "https://www.blueprint.com/lakebase"
"Bug Tracker" = "https://github.com/BlueprintTechnologies/lakebase-assess/issues"

[project.scripts]
lakebase-assess = "src.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
norecursedirs = [".git", ".vscode", "src", "docs", "pricing_maps", "templates", "assessment-output"]
addopts = "-v --tb=short"
minversion = "7.0"